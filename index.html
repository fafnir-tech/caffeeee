        <!-- I struggled with the JS part, but after watching tutorials and doing some research, I actually made it work 😄 -->
        <script>
            /*Background Music*/
            const musicToggle = document.getElementById('music-toggle');
            const musicIcon = document.getElementById('music-icon');
            const backgroundMusic = document.getElementById('background-music');

            let isPlaying = false;

            musicToggle.addEventListener('click', () => {
                if (isPlaying) {
                    backgroundMusic.pause();
                    musicIcon.src = 'images/music-off-icon.png';
                    musicIcon.alt ='Music Off'
                } else {
                    backgroundMusic.play();
                    musicIcon.src = 'images/music-on-icon.png';
                    musicIcon.alt ='Music On'
                }
            isPlaying = !isPlaying;
            });

            /*Dark-Light mode*/
    
            const themeSwitchIcon = document.getElementById('theme-switch-icon');
            const headerImage = document.getElementById('header-image');

            const enableDarkmode = () => {
                document.body.classList.add('darkmode');
               
				
            };

            const disableDarkmode = () => {
               
                headerImage.src = 'images/day-cafe.gif';
                headerImage.alt = 'Cafe de Wisteria in daylight';
            };

            disableDarkmode();

            themeSwitch.addEventListener('click', () => {
                if (!document.body.classList.contains('darkmode')) {
                enableDarkmode();
                } else {
                disableDarkmode();
                }
            });
        </script>
